kind = "web"
previewPath = "/"
title = "Rankin Insulation"
version = "1.0.0"
id = "artifacts/rankin-insulation"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20988

[services.development]
run = "pnpm --filter @workspace/rankin-insulation run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rankin-insulation", "run", "build" ]
publicDir = "artifacts/rankin-insulation/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20988"
BASE_PATH = "/"
